[project]
name = "direct-beam-tracker-viewer"
version = "0.1.0"
description = "Web viewer and control panel for the kotekan direct beam tracker (REST-only, low-cadence)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "websockets>=12.0",
    "numpy>=2.4.6",
]

[project.scripts]
viewer = "viewer.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long
    "B008", # function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF018", "RUF059"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
