[project]
name = "direct-beam-tracker-viewer"
version = "0.1.0"
description = "Web viewer and control panel for the kotekan direct beam tracker (REST-only, low-cadence)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
viewer = "viewer.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
